<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Chat App</span>
    <div>
      <span class="text-light me-3">Welcome, <strong id="display-username"></strong></span>
      <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row" style="height: calc(100vh - 56px);">

      <!-- Room List -->
      <div class="col-md-3 bg-light border-end p-3">
        <h5>Rooms</h5>
        <div class="list-group" id="room-list">
          <button class="list-group-item list-group-item-action" data-room="devops">devops</button>
          <button class="list-group-item list-group-item-action" data-room="cloud computing">cloud computing</button>
          <button class="list-group-item list-group-item-action" data-room="covid19">covid19</button>
          <button class="list-group-item list-group-item-action" data-room="sports">sports</button>
          <button class="list-group-item list-group-item-action" data-room="nodeJS">nodeJS</button>
        </div>
        <button class="btn btn-danger w-100 mt-3 d-none" id="leave-room-btn">Leave Room</button>
      </div>

      <!-- Chat Area -->
      <div class="col-md-6 d-flex flex-column p-0">
        <div class="bg-secondary text-white p-2" id="room-header">
          <h5 class="mb-0">Select a room to start chatting</h5>
        </div>
        <div class="flex-grow-1 overflow-auto p-3" id="messages-area"></div>
        <div class="px-3 py-1 text-muted small" id="typing-indicator" style="height: 24px;"></div>
        <div class="p-3 border-top">
          <form id="message-form" class="d-flex">
            <input type="text" class="form-control me-2" id="message-input" placeholder="Type a message..." disabled>
            <button type="submit" class="btn btn-primary" id="send-btn" disabled>Send</button>
          </form>
        </div>
      </div>

      <!-- Online Users -->
      <div class="col-md-3 bg-light border-start p-3">
        <h5>Online Users</h5>
        <ul class="list-group" id="users-list"></ul>
      </div>

    </div>
  </div>

  <!-- Private Message Modal -->
  <div class="modal fade" id="pmModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Private Message to <span id="pm-target-user"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="pm-messages" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;"></div>
          <input type="text" class="form-control" id="pm-input" placeholder="Type a private message...">
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="pm-send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
